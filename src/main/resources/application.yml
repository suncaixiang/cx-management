server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: cx-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

logging:
  file:
    name: logs/cx-management.log
  level:
    root: info
    com.cx.management: debug

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  expiration: 86400000

trading:
  api:
    host: 47.103.55.121
    port: 18803
    port1: 17803
    ssl-enabled: true
    sa: mn1366
    sapass: S5d9sDJ
    connect-timeout: 10000
    read-timeout: 30000
    ssl-verify: false
    recycle-name: ""
